
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MangaPanel.online</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b12;color:#f5f3ff;font-family:Arial,sans-serif}
header{text-align:center;padding:35px 18px 25px;background:linear-gradient(150deg,#211638,#0b0b12)}
.logo{font-size:25px;font-weight:900}
.logo span,h1 span{color:#a78bfa}
.eyebrow{color:#c4b5fd;font-size:11px;letter-spacing:3px;margin-top:35px}
h1{font-size:clamp(36px,8vw,58px);margin:12px 0}
.subtitle{color:#b3afc4;line-height:1.6}
form{display:flex;gap:8px;max-width:650px;margin:25px auto 12px;padding:7px;background:#171622;border:1px solid #39334d;border-radius:14px}
input{flex:1;width:0;min-width:0;background:transparent;border:0;outline:0;color:white;padding:12px;font-size:14px}
button{border:0;border-radius:9px;padding:12px 16px;background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
#status{font-size:13px;color:#aaa5bd;min-height:20px}
main{max-width:1100px;margin:auto;padding:20px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px}
h2{font-size:22px;margin:0 0 6px}
.heading p,.credit{color:#9995ab;font-size:12px}
.pill{font-size:10px;color:#c4b5fd;border:1px solid #514276;padding:7px;border-radius:20px}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{min-width:0;overflow:hidden;border-radius:12px;background:#171622;border:1px solid #292638}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#201d2b;display:block}
.info{padding:10px}
.info h3{font-size:13px;line-height:1.5;overflow-wrap:anywhere;margin:0 0 8px}
.info p{font-size:11px;color:#aaa5bd;line-height:1.5}
.info a{font-size:12px;color:#c4b5fd;text-decoration:none}
#more{display:block;margin:25px auto}
.credit{text-align:center;line-height:1.6;margin:30px 0}
@media(min-width:650px){.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="logo">MP<span>.</span></div>
  <p class="eyebrow">YOUR VISUAL DISCOVERY HUB</p>
  <h1>Find Your <span>Panel.</span></h1>
  <p class="subtitle">Discover manga art, comic illustrations and more.</p>
  <form id="searchForm">
    <input id="searchInput" placeholder="Search manga art..." required>
    <button>Search</button>
  </form>
  <p id="status">Search for images to get started.</p>
</header>
<main>
  <div class="heading">
    <div><h2>Explore images</h2><p>From Wikimedia Commons</p></div>
    <span class="pill">FREE SOURCE</span>
  </div>
  <div id="results" class="gallery"></div>
  <button id="more" hidden>Load more images</button>
  <p class="credit">Check each image's license before reusing it. Search results may not include copyrighted manga panels.</p>
</main>
<script>
const form=document.getElementById("searchForm");
const input=document.getElementById("searchInput");
const status=document.getElementById("status");
const results=document.getElementById("results");
const more=document.getElementById("more");
let query="",offset=0,busy=false;

async function searchImages(append=false){
 if(busy)return;
 busy=true;
 more.disabled=true;
 status.textContent="Searching for pictures...";
 if(!append){results.replaceChildren();offset=0;more.hidden=true}
 const p=new URLSearchParams({
  action:"query",generator:"search",
  gsrsearch:query+" filetype:bitmap",
  gsrnamespace:"6",gsrlimit:"20",gsroffset:String(offset),
  prop:"imageinfo",iiprop:"url|extmetadata",
  iiurlwidth:"500",format:"json",origin:"*"
 });
 try{
  const r=await fetch("https://commons.wikimedia.org/w/api.php?"+p);
  if(!r.ok)throw Error("Search unavailable");
  const data=await r.json();
  const pages=Object.values(data.query?.pages||{});
  const usable=pages.filter(x=>x.imageinfo?.[0]?.thumburl);
  if(!append&&!usable.length){status.textContent="No pictures found. Try another search.";return}
  usable.forEach(page=>{
   const info=page.imageinfo[0];
   const card=document.createElement("article");
   card.className="card";
   const img=document.createElement("img");
   img.src=info.thumburl;img.alt=page.title;img.loading="lazy";
   const box=document.createElement("div");box.className="info";
   const title=document.createElement("h3");
   title.textContent=page.title.replace(/^File:/,"").replaceAll("_"," ");
   const license=document.createElement("p");
   license.textContent="License: "+(info.extmetadata?.LicenseShortName?.value||"Check original page");
   const link=document.createElement("a");
   link.href=info.descriptionurl;link.target="_blank";
   link.rel="noopener noreferrer";link.textContent="View image & rights ↗";
   box.append(title,license,link);card.append(img,box);results.append(card);
  });
  offset+=pages.length;
  more.hidden=!data.continue;
  more.dataset.next=data.continue?"yes":"no";
  status.textContent="Found "+results.children.length+" pictures for “"+query+"”.";
 }catch(e){
  status.textContent="Could not load images. Check your connection and try again.";
 }finally{busy=false;more.disabled=false}
}
form.addEventListener("submit",e=>{
 e.preventDefault();query=input.value.trim();
 if(query)searchImages();
});
more.addEventListener("click",()=>{
 if(more.dataset.next==="yes")searchImages(true);
});
</script>
</body>
  </html>
